<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة والتقويم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
        
        /* تصميم البطاقة الرئيسية */
        .card {
            background-color: #c7d2fe; /* لون الفواصل (بنفسجي فاتح) */
            border: 3px solid #c7d2fe; /* الإطار الخارجي سميك */
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            
            /* استخدام شبكة من 6 أعمدة */
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px; /* عرض الفاصل (2 بكسل) */
        }

        .cell { 
            background-color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            padding: 10px 5px;
        }

        /* تخصيص الأعمدة: كل جزء يأخذ نصف الشاشة (3 أعمدة من 6) */
        .half-width { grid-column: span 3; }
        
        /* تخصيص المواقيت: كل موقت يأخذ ثلث الشاشة (2 عمود من 6) */
        .third-width { grid-column: span 2; }

        /* تنسيق الصفوف العلوية */
        .year-cell { padding: 12px 0; font-weight: bold; font-size: 18px; color: #1e293b; background-color: #f8fafc; }
        .month-cell { font-weight: bold; font-size: 16px; color: #0f172a; }
        .day-cell { font-size: 32px; font-weight: bold; color: #4f46e5; background-color: #eef2ff; padding: 8px; }

        /* تنسيق المواقيت */
        .prayer-name { font-size: 13px; color: #4f46e5; font-weight: bold; margin-bottom: 5px; }
        .prayer-time { font-size: 16px; color: #334155; font-weight: bold; direction: ltr; }
        
        /* شريط الموقع */
        .location-bar { grid-column: span 6; background-color: #f8fafc; font-size: 11px; color: #64748b; padding: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <!-- الصف الأول: السنوات (بالعرض ومقسمة نصفين) -->
        <div class="cell half-width year-cell" id="gregYear">----</div>
        <div class="cell half-width year-cell" id="hijriYear">----</div>

        <!-- الصف الثاني: الأشهر (بالعرض ومقسمة نصفين) -->
        <div class="cell half-width month-cell" id="gregMonth">----</div>
        <div class="cell half-width month-cell" id="hijriMonth">----</div>

        <!-- الصف الثالث: الأيام (بالعرض ومقسمة نصفين) -->
        <div class="cell half-width day-cell" id="gregDay">--</div>
        <div class="cell half-width day-cell" id="hijriDay">--</div>

        <!-- الصف الرابع: الصلوات الأولى (مقسمة لثلاثة أجزاء) -->
        <div class="cell third-width">
            <div class="prayer-name">الفجر</div>
            <div class="prayer-time" id="fajr">--:--</div>
        </div>
        <div class="cell third-width">
            <div class="prayer-name">الشمس</div>
            <div class="prayer-time" id="sunrise">--:--</div>
        </div>
        <div class="cell third-width">
            <div class="prayer-name">الظهر</div>
            <div class="prayer-time" id="dhuhr">--:--</div>
        </div>

        <!-- الصف الخامس: الصلوات الثانية (مقسمة لثلاثة أجزاء) -->
        <div class="cell third-width">
            <div class="prayer-name">العصر</div>
            <div class="prayer-time" id="asr">--:--</div>
        </div>
        <div class="cell third-width">
            <div class="prayer-name">المغرب</div>
            <div class="prayer-time" id="maghrib">--:--</div>
        </div>
        <div class="cell third-width">
            <div class="prayer-name">العشاء</div>
            <div class="prayer-time" id="isha">--:--</div>
        </div>
        
        <!-- شريط الموقع -->
        <div class="location-bar">القاهرة، مصر (طريقة الأزهر الشريف)</div>
    </div>

    <script>
        // دالة لتحويل الوقت من 24 ساعة إلى 12 ساعة (بدون AM/PM)
        function formatTime12h(time24) {
            if (!time24) return '--:--';
            let [hours, minutes] = time24.split(':');
            let h = parseInt(hours, 10);
            h = h % 12;
            h = h ? h : 12; // لو الساعة 0 تبقى 12
            return `${h}:${minutes}`;
        }

        // دالة جلب البيانات
        async function fetchData() {
            const now = new Date();
            
            // 1. تحديث الميلادي مباشرة من المتصفح (لضمان الظهور)
            document.getElementById('gregYear').textContent = now.getFullYear();
            document.getElementById('gregMonth').textContent = now.toLocaleDateString('ar-EG', { month: 'long' });
            document.getElementById('gregDay').textContent = now.getDate();

            try {
                // 2. جلب المواقيت والهجري من السيرفر (طريقة 5 = الأزهر)
                const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5&language=ar');
                const data = await response.json();
                
                const timings = data.data.timings;
                const hijri = data.data.date.hijri;

                // تحديث الهجري
                document.getElementById('hijriYear').textContent = hijri.year;
                document.getElementById('hijriMonth').textContent = hijri.month.ar;
                document.getElementById('hijriDay').textContent = hijri.day;

                // تحديث المواقيت
                document.getElementById('fajr').textContent = formatTime12h(timings.Fajr);
                document.getElementById('sunrise').textContent = formatTime12h(timings.Sunrise);
                document.getElementById('dhuhr').textContent = formatTime12h(timings.Dhuhr);
                document.getElementById('asr').textContent = formatTime12h(timings.Asr);
                document.getElementById('maghrib').textContent = formatTime12h(timings.Maghrib);
                document.getElementById('isha').textContent = formatTime12h(timings.Isha);

            } catch (error) {
                console.error("حدث خطأ في جلب البيانات:", error);
            }
        }

        // تشغيل الدالة فوراً عند التحميل
        fetchData();
        
        // تحديث البيانات كل دقيقة (60000 مللي ثانية)
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
